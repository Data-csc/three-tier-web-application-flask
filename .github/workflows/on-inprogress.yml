name: dev-claude on agent:start

# Add the label `agent:start` to an issue to trigger the pipeline.
# The issue must already be added to the org project (PVT_kwDOBS4dts4BUiYO).
# Lambda resolves project_item_id via MCP (GitHub App has org-project access
# that the workflow's GITHUB_TOKEN does not).

on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  issues: read

jobs:
  trigger:
    if: github.event.label.name == 'agent:start'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue via GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on Issue {
                    number title body
                    author { login }
                    repository { name owner { login } url }
                    comments(first: 100) {
                      nodes { id body createdAt author { login } }
                    }
                  }
                }
              }' \
            -F id="$ISSUE_NODE_ID" > issue.json

          jq '{
            repo_owner:     .data.node.repository.owner.login,
            repo_name:      .data.node.repository.name,
            repo_url:       .data.node.repository.url,
            issue_number:   .data.node.number,
            issue_title:    .data.node.title,
            issue_body:     .data.node.body,
            issue_author:   .data.node.author.login,
            issue_comments: .data.node.comments.nodes
          }' issue.json > payload.json

          cat payload.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SFN_EXECUTE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Start dev-claude state machine
        env:
          STATE_MACHINE_ARN: ${{ secrets.DEV_CLAUDE_STATE_MACHINE_ARN }}
        run: |
          aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --name "issue-${{ github.event.issue.number }}-$(date +%s)" \
            --input file://payload.json
