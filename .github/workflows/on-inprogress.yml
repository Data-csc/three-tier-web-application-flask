name: dev-claude on agent:start

# GitHub Actions doesn't support the `projects_v2_item` event. To trigger the
# pipeline, add the label `agent:start` to an issue (the human equivalent of
# dragging the card to "In Progress"). Lambda moves the project card to
# In Progress via MCP once it begins processing.

on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  issues: read

jobs:
  trigger:
    if: github.event.label.name == 'agent:start'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue via GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on Issue {
                    number title body
                    author { login }
                    repository { name owner { login } url }
                    comments(first: 100) {
                      nodes { id body createdAt author { login } }
                    }
                    projectItems(first: 5) {
                      nodes {
                        id
                        project { id title }
                      }
                    }
                  }
                }
              }' \
            -F id="$ISSUE_NODE_ID" > issue.json

          # Pick the project item id for our org project (PVT_kwDOBS4dts4BUiYO).
          PROJECT_ITEM_ID=$(jq -r '.data.node.projectItems.nodes[]
            | select(.project.id == "PVT_kwDOBS4dts4BUiYO") | .id' issue.json | head -1)

          if [ -z "$PROJECT_ITEM_ID" ] || [ "$PROJECT_ITEM_ID" = "null" ]; then
            echo "::error::Issue is not on project PVT_kwDOBS4dts4BUiYO. Add it to the project first."
            exit 1
          fi

          jq --arg item_id "$PROJECT_ITEM_ID" '{
            repo_owner:      .data.node.repository.owner.login,
            repo_name:       .data.node.repository.name,
            repo_url:        .data.node.repository.url,
            issue_number:    .data.node.number,
            issue_title:     .data.node.title,
            issue_body:      .data.node.body,
            issue_author:    .data.node.author.login,
            issue_comments:  .data.node.comments.nodes,
            project_item_id: $item_id
          }' issue.json > payload.json

          cat payload.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LAMBDA_INVOKE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Invoke dev-claude Lambda (async)
        env:
          LAMBDA_NAME: ${{ secrets.DEV_CLAUDE_LAMBDA_NAME }}
        run: |
          aws lambda invoke \
            --function-name "$LAMBDA_NAME" \
            --invocation-type Event \
            --cli-binary-format raw-in-base64-out \
            --payload fileb://payload.json \
            /dev/null
